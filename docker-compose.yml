services:
  postgres:
    image: postgres:16-alpine
    container_name: codesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codesense
      POSTGRES_PASSWORD: codesense_password
      POSTGRES_DB: codesense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesense -d codesense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesense-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://codesense:codesense_password@postgres:5432/codesense_db
      - AI_API_KEY=${AI_API_KEY:-${API_KEY:-}}
      - API_KEY=${API_KEY:-${AI_API_KEY:-}}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash}
      - FRONTEND_URL=http://localhost:5173
      - JAVA_COMPILER_PATH=javac
      - COMPILATION_TIMEOUT_SECONDS=10
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: codesense-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
